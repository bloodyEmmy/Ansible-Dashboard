<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansible Audit Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ansible Audit Dashboard</h1>
        </header>
        
        <div class="dashboard-grid">
            <div class="panel filters-panel">
                <h3>Фильтры</h3>
                <div class="filter-group">
                    <label>С даты:</label>
                    <input type="date" id="start_date">
                </div>
                <div class="filter-group">
                    <label>По дату:</label>
                    <input type="date" id="end_date">
                </div>
                <div class="filter-group">
                    <label>Пользователь:</label>
                    <input type="text" id="user" placeholder="a.ivanov">
                </div>
                <div class="filter-group">
                    <label>Название Playbook:</label>
                    <input type="text" id="playbook" placeholder="nginx">
                </div>
                
                <div class="button-group">
                    <button class="btn-clear" onclick="clearFilters()">Очистить всё</button>
                    <button class="btn-primary" onclick="loadHistory()">Найти</button>
                </div>
            </div>
            
            <div class="panel chart-panel">
                <canvas id="statusChart"></canvas>
            </div>
            
            <div class="panel chart-panel">
                <canvas id="userChart"></canvas>
            </div>
        </div>

        <div class="panel table-panel">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Playbook (клик)</th>
                        <th>Пользователь</th>
                        <th>Статус</th>
                        <th>Запуск</th>
                        <th>Длительность</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="codeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <pre><code id="modalCode"></code></pre>
        </div>
    </div>

    <script>
        let myChart = null;
        let myUserChart = null;

        ['user', 'playbook'].forEach(id => {
            document.getElementById(id).addEventListener('paste', function(e) {
                setTimeout(() => {
                    this.value = this.value.trim();
                }, 10);
            });
        });

        function formatRuDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            }).replace(',', '');
        }

        function getDuration(start, end) {
            const diff = new Date(end) - new Date(start);
            const minutes = Math.floor(diff / 60000);
            const seconds = ((diff % 60000) / 1000).toFixed(0);
            return `${minutes}м ${seconds}с`;
        }

        async function loadHistory() {
            const userField = document.getElementById('user');
            const playbookField = document.getElementById('playbook');
            userField.value = userField.value.trim();
            playbookField.value = playbookField.value.trim();

            const startDate = document.getElementById('start_date').value;
            const endDate = document.getElementById('end_date').value;
            const user = userField.value;
            const playbook = playbookField.value;

            let url = new URL('/api/history', window.location.origin);
            if (startDate) url.searchParams.append('start_date', startDate + " 00:00:00");
            if (endDate) url.searchParams.append('end_date', endDate + " 23:59:59");
            if (user) url.searchParams.append('user', user);
            if (playbook) url.searchParams.append('playbook', playbook);

            try {
                const response = await fetch(url);
                const result = await response.json();
                
                const tbody = document.querySelector('#historyTable tbody');
                tbody.innerHTML = ''; 

                let successCount = 0;
                let failedCount = 0;
                let userCounts = {};
                let counter = 1;

                result.data.forEach(run => {
                    if (run.status === 'SUCCESS') successCount++;
                    else failedCount++;

                    userCounts[run.user] = (userCounts[run.user] || 0) + 1;

                    const row = `<tr>
                        <td>${counter++}</td>
                        <td class="playbook-name" onclick="handlePlaybookClick(event, '${run.playbook_name}')"><span>${run.playbook_name}</span></td>
                        <td><span>${run.user}</span></td>
                        <td><span class="badge ${run.status.toLowerCase()}">${run.status}</span></td>
                        <td class="time-col">${formatRuDate(run.start_time)}</td>
                        <td class="time-col">${getDuration(run.start_time, run.end_time)}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                updateStatusChart(successCount, failedCount);
                updateUserChart(userCounts);
            } catch (error) { console.error("Ошибка API:", error); }
        }

        function clearFilters() {
            document.getElementById('start_date').value = '';
            document.getElementById('end_date').value = '';
            document.getElementById('user').value = '';
            document.getElementById('playbook').value = '';
            loadHistory(); 
        }

        function handlePlaybookClick(event, filename) {
            const selection = window.getSelection().toString();
            if (selection.length > 0) {
                return;
            }
            viewPlaybook(filename);
        }

        async function viewPlaybook(filename) {
            try {
                const response = await fetch(`/api/playbook/${filename}`);
                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('modalTitle').innerText = filename;
                    document.getElementById('modalCode').innerText = result.content;
                    document.getElementById('codeModal').style.display = "block";
                }
            } catch (error) { alert("Ошибка загрузки файла"); }
        }

        function closeModal() { document.getElementById('codeModal').style.display = "none"; }

        function updateStatusChart(success, failed) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Успешно', 'Ошибка'], datasets: [{ data: [success, failed], backgroundColor: ['#2ecc71', '#e74c3c'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

        function updateUserChart(dataMap) {
            const ctx = document.getElementById('userChart').getContext('2d');
            if (myUserChart) myUserChart.destroy();
            myUserChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(dataMap),
                    datasets: [{ label: 'Количество запусков', data: Object.values(dataMap), backgroundColor: '#7b5ab5', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
