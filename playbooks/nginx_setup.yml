---
- name: Configure Nginx Web Server
  hosts: webservers
  become: yes
  vars:
    http_port: 80
    app_name: "dashboard"
  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create custom web root directory
      file:
        path: "/var/www/{{ app_name }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy index.html to web root
      copy:
        content: "<h1>Welcome to the Ansible configured server!</h1>"
        dest: "/var/www/{{ app_name }}/index.html"

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes